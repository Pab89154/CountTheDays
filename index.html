<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CountTheDays — How Many Days Until?</title>
  <meta name="description" content="Find out how many days are left until holidays, seasons, or any date you choose." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="brand">CountTheDays</p>
      <h1>How many days until?</h1>
      <p class="lede">Pick a holiday, a season, or your own date — we’ll count the days from today.</p>
    </header>

    <main class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading" class="panel-title">Select the date and find out how many days are left until:</h2>

      <form id="countdown-form" novalidate>
        <fieldset class="events">
          <legend class="sr-only">Event</legend>
          <div class="events-grid">
            <label class="event-option">
              <input type="radio" name="event" value="christmas" />
              <span>Christmas Day</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="thanksgiving" />
              <span>Thanksgiving Day</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="halloween" />
              <span>Halloween</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="easter" />
              <span>Easter Sunday</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="mothers-day" />
              <span>Mother’s Day</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="fathers-day" />
              <span>Father’s Day</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="independence-day" />
              <span>Independence Day</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="valentines-day" />
              <span>Valentine’s Day</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="new-years-day" />
              <span>New Year’s Day</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="winter" />
              <span>Winter</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="summer" />
              <span>Summer</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="spring" />
              <span>Spring</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="autumn" />
              <span>Autumn</span>
            </label>
            <label class="event-option">
              <input type="radio" name="event" value="ramadan" />
              <span>First Day of Ramadan</span>
            </label>
            <label class="event-option custom-option">
              <input type="radio" name="event" value="custom" checked />
              <span>Select the date</span>
            </label>
          </div>
        </fieldset>

        <div class="custom-date" id="custom-date-fields">
          <label class="field">
            <span class="field-label">Day</span>
            <select id="custom-day" name="day">
              <option value="">----</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Month</span>
            <select id="custom-month" name="month">
              <option value="">----</option>
              <option value="1">January</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May</option>
              <option value="6">June</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
          </label>
        </div>

        <p class="form-error" id="form-error" hidden></p>

        <button type="submit" class="calculate-btn">Calculate</button>
      </form>

      <section class="result" id="result" hidden aria-live="polite">
        <p class="result-label" id="result-label"></p>
        <p class="result-days" id="result-days"></p>
        <p class="result-date" id="result-date"></p>
      </section>
    </main>

    <p class="footer-note">Find out how many days are left until the most awaited events of the year.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
